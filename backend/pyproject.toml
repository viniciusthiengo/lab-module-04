[project]
name = "codebase-rag-api"
version = "1.0.0"
description = "Questions and answers over codebases: code-aware chunking, ChromaDB, hybrid retrieval, reranking, Claude answers and an evaluation suite."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# The demo codebases are data to index, not part of the application.
extend-exclude = ["demo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
